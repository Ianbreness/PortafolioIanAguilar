<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Fragmentos Carrito</title>
    </head>
    <body>

        <!-- 🛒 LISTADO DEL CARRITO -->
        <div th:fragment="listadoCarrito">

            <div class="card mt-3">
                <div class="card-header bg-dark text-white">
                    🛒 Carrito de Compras
                </div>

                <div class="card-body">

                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="item : ${items}">
                                <td th:text="${item.producto.descripcion}"></td>
                                <td th:text="${item.cantidad}"></td>
                                <td th:text="${item.total}"></td>

                                <td>
                                    <a class="btn btn-danger btn-sm"
                                       th:href="@{/carrito/eliminar/{id}(id=${item.producto.idProducto})}">
                                        ❌
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- TOTAL -->
                    <div class="text-end">
                        <h5>Total: ₡ <span th:text="${total}"></span></h5>
                    </div>

                    <!-- BOTÓN FACTURAR -->
                    <div class="text-end">
                        <a class="btn btn-success"
                           th:href="@{/carrito/facturar}">
                            Finalizar Compra
                        </a>
                    </div>

                </div>
            </div>

        </div>

    </body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <section class="container py-4">
            <div class="row">

                <!-- 🛒 TABLA -->
                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header bg-dark text-white">
                            <h4><i class="fas fa-cart-shopping"></i> Productos en el Carrito</h4>
                        </div>

                        <div class="card-body p-0">

                            <!-- CUANDO HAY PRODUCTOS -->
                            <div th:if="${carritoItems != null and !#lists.isEmpty(carritoItems)}">
                                <table class="table table-striped table-hover mb-0">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>#</th>
                                            <th>Descripción</th>
                                            <th>Precio</th>
                                            <th>Cantidad</th>
                                            <th>Total</th>
                                            <th></th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        <tr th:each="item : ${carritoItems}">
                                            <td th:text="${item.producto.idProducto}"></td>
                                            <td th:text="${item.producto.descripcion}"></td>
                                            <td th:text="${#numbers.formatCurrency(item.producto.precio)}"></td>
                                            <td th:text="${item.cantidad}"></td>
                                            <td th:text="${#numbers.formatCurrency(item.subTotal)}"></td>

                                            <td class="d-flex gap-1">

                                                <!-- ELIMINAR -->
                                                <form th:action="@{/carrito/eliminar}" method="post">
                                                    <input type="hidden" name="idProducto"
                                                           th:value="${item.producto.idProducto}"/>
                                                    <button type="submit" class="btn btn-danger btn-sm">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>

                                                <!-- MODIFICAR -->
                                                <a th:href="@{/carrito/modificar/{id}(id=${item.producto.idProducto})}"
                                                   class="btn btn-warning btn-sm">
                                                    <i class="fas fa-pen"></i>
                                                </a>

                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- VACÍO -->
                            <div th:unless="${carritoItems != null and !#lists.isEmpty(carritoItems)}"
                                 class="p-4 text-center text-muted">
                                <i class="fas fa-cart-shopping fa-3x mb-3"></i>
                                <p>El carrito está vacío.</p>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- 💰 TOTAL -->
                <div class="col-md-3">
                    <div class="card">

                        <div class="card-header bg-primary text-white text-center">
                            <h5>Total</h5>
                            <h4 th:text="${#numbers.formatCurrency(carritoTotal)}">₡0</h4>
                        </div>

                        <div class="card-body d-grid gap-2">

                            <a href="/consultas/listado" class="btn btn-success">
                                <i class="fas fa-rotate-left"></i> Seguir Comprando
                            </a>

                            <form th:action="@{/carrito/facturar}" method="post"
                                  th:if="${carritoItems != null and !#lists.isEmpty(carritoItems)}">

                                <button type="submit" class="btn btn-info w-100 text-white">
                                    <i class="fas fa-file-invoice"></i> Facturar
                                </button>

                            </form>

                        </div>

                    </div>
                </div>

            </div>
        </section>

        <div th:replace="~{general/fragmentos :: mostrarToast}"></div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>

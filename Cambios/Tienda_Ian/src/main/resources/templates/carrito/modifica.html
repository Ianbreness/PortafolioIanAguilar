<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <section class="container py-4" style="max-width: 500px;">
            <div class="card shadow">

                <div class="card-header bg-warning text-dark">
                    <h5><i class="fas fa-pen"></i> Modificar Cantidad</h5>
                </div>

                <!-- ✅ CUANDO EXISTE EL ITEM -->
                <div class="card-body" th:if="${itemEditar != null}">

                    <p class="fw-bold fs-5"
                       th:text="${itemEditar.producto.descripcion}">Producto</p>

                    <p>
                        Precio:
                        <span th:text="${#numbers.formatCurrency(itemEditar.producto.precio)}">₡0</span>
                    </p>

                    <form th:action="@{/carrito/modificar}" method="post">

                        <input type="hidden" name="idProducto"
                               th:value="${itemEditar.producto.idProducto}"/>

                        <div class="mb-3">
                            <label class="form-label">Nueva Cantidad</label>
                            <input type="number"
                                   name="cantidad"
                                   class="form-control"
                                   th:value="${itemEditar.cantidad}"
                                   min="1"
                                   required/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save"></i> Guardar
                            </button>

                            <a href="/carrito/listado" class="btn btn-secondary">
                                <i class="fas fa-xmark"></i> Cancelar
                            </a>
                        </div>

                    </form>
                </div>

                <!-- ❌ CUANDO NO EXISTE -->
                <div class="card-body text-center" th:unless="${itemEditar != null}">
                    <p class="text-danger fw-bold">Producto no encontrado en el carrito.</p>

                    <a href="/carrito/listado" class="btn btn-secondary">
                        Volver
                    </a>
                </div>

            </div>
        </section>

        <div th:replace="~{general/fragmentos :: mostrarToast}"></div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Fragmento: tabs de categorías -->
    <section th:fragment="tabs" class="container-fluid pt-3 pb-2">
        <ul class="nav nav-underline justify-content-center">
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/}">Todas</a>
            </li>
            <li class="nav-item" th:each="cat : ${categorias}">
                <a class="nav-link" th:href="@{/consultas/{id}(id=${cat.idCategoria})}"
                   th:text="${cat.descripcion}">Categoría</a>
            </li>
        </ul>
    </section>

    <!-- Fragmento: tarjetas de productos -->
    <section th:fragment="tarjetas" class="container-fluid p-3">
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-3">
            <div class="col" th:each="p : ${productos}">
                <div class="card h-100">
                    <img th:src="${p.rutaImagen}" class="card-img-top"
                         style="height:180px; object-fit:cover;"
                         alt="imagen producto"/>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${p.descripcion}">Nombre</h5>
                        <p class="card-text text-muted small"
                           th:text="${#strings.abbreviate(p.detalle, 50)}">Detalle...</p>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <span class="text-success h5"
                              th:text="'₡' + ${#numbers.formatDecimal(p.precio, 1, 'WHITESPACE', 2, 'COMMA')}">₡0</span>
                        <span th:if="${p.existencias != null and p.existencias > 0}"
                              class="badge text-bg-success ms-2"
                              th:text="${p.existencias} + ' unidades'">Stock</span>
                        <span th:if="${p.existencias == null or p.existencias == 0}"
                              class="badge text-bg-danger ms-2">Agotado</span>
                        <button class="btn btn-primary btn-sm">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Fragmento: formularios de consultas -->
    <section th:fragment="consultas" class="row row-cols-4 p-2">
        <div th:replace="~{consultas/fragmentos :: formConsulta('primary',#{consultas.derivadas},'/consultas/consultaDerivada')}"/>
        <div th:replace="~{consultas/fragmentos :: formConsulta('warning',#{consultas.jpql},'/consultas/consultaJPQL')}"/>
        <div th:replace="~{consultas/fragmentos :: formConsulta('success',#{consultas.sql},'/consultas/consultaSQL')}"/>
        <div class="card"><p>Acá va su Práctica #2</p></div>
    </section>

    <!-- Fragmento parametrizado: formulario reutilizable -->
    <div th:fragment="formConsulta(colorForm, textoForm, urlForm)">
        <form method="post" th:action="@{${urlForm}}" class="was-validated">
            <div class="card p-2">
                <div class="card-header text-center text-white"
                     th:classappend="'bg-'+${colorForm}">
                    <h5>[[${textoForm}]]</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label>[[#{consultas.precio.inferior}]]</label>
                        <input type="number" name="precioInf"
                               th:value="${precioInf}"
                               class="form-control" min="0" required/>
                    </div>
                    <div class="mb-3">
                        <label>[[#{consultas.precio.superior}]]</label>
                        <input type="number" name="precioSup"
                               th:value="${precioSup}"
                               class="form-control" min="0" required/>
                    </div>
                </div>
                <div class="card-footer text-center">
                    <button type="submit" class="btn text-white"
                            th:classappend="'btn-'+${colorForm}">
                        <i class="fa-solid fa-magnifying-glass"></i> [[${textoForm}]]
                    </button>
                </div>
            </div>
        </form>
    </div>

</body>
</html>

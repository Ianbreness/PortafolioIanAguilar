<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:fragment="head">
        <title>TechShop</title>
        <meta charset="UTF-8"/>

        <link rel="icon" type="image/png" sizes="16x16" href="/fav/favicon-16x16.png"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/fav/favicon-32x32.png"/>
        <link rel="icon" type="image/png" sizes="96x96" href="/fav/favicon-96x96.png"/>
        <link rel="icon" type="image/png" sizes="256x256" href="/fav/favicon-256x256.png"/>

        <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/6.5.1/css/all.min.css}" rel="stylesheet"/>
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>

        <!-- ✅ ORDEN CORRECTO -->
        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/js/rutinas.js}"></script>
        <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>

        <!-- CSRF -->
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </head>

    <body>

        <header th:fragment="header" class="header">
            <nav class="navbar navbar-expand-sm navbar-dark bg-dark p-0">
                <div class="container">
                    <a href="/" class="navbar-brand">
                        [[#{aplicacion.titulo}]]
                    </a>

                    <button class="navbar-toggler" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarCollapse">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">

                        <ul class="navbar-nav">
                            <li class="nav-item px-2"><a class="nav-link" href="/categoria/listado">[[#{plantilla.categorias}]]</a></li>
                            <li class="nav-item px-2"><a class="nav-link" href="/producto/listado">[[#{plantilla.productos}]]</a></li>
                            <li class="nav-item px-2"><a class="nav-link" href="/consultas/listado">[[#{plantilla.consultas}]]</a></li>
                        </ul>

                        <ul class="navbar-nav align-items-center gap-2">

                            <!-- ✅ CARRITO CORREGIDO -->
                            <li class="nav-item">
                                <a href="/carrito/listado" class="btn btn-primary btn-sm">
                                    <i class="fas fa-cart-plus"></i> Ver Carrito
                                </a>
                            </li>

                            <!-- Login / Logout -->
                            <li class="nav-item" sec:authorize="isAnonymous()">
                                <a class="btn btn-outline-light btn-sm" href="/login">
                                    <i class="fas fa-right-to-bracket"></i> Login
                                </a>
                            </li>

                            <li class="nav-item" sec:authorize="isAuthenticated()">
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">
                                        <i class="fas fa-right-from-bracket"></i> Logout
                                    </button>
                                </form>
                            </li>

                        </ul>
                    </div>
                </div>
            </nav>

            <section class="py-2 bg-success text-white">
                <div class="container">
                    <h1><i class="fas fa-cog"></i> [[#{plantilla.suTienda}]]</h1>
                </div>
            </section>
        </header>

        <footer th:fragment="footer" class="p-2 mt-5 bg-info text-white">
            <p class="lead text-center">
                [[#{plantilla.derechos}]] &copy;
            </p>
        </footer>

    </body>
</html>
